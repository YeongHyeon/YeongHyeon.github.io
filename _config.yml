  - {title: LiteBites, url: "https://litebites.github.io/"}
  - {title: Tityra, url: "https://tityra.github.io/"}

plugins:
  - jekyll-feed

exclude:
  - README.md
  - CHANGELOG.md
  - Gemfile
  - Gemfile.lock
  - vendor
