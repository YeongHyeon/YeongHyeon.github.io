---
title: "Home"
layout: default
---

{% include home.html %}

<article>
  <h2 class="section-label">Photos</h2>
  <div id="image-grid" class="photo-grid">
    {% assign thumbnails = site.static_files | where_exp: "file", "file.path contains '/images/thumbnails/'" %}
    <script>
    const images = [
      {% for file in thumbnails %}
      { src: "{{ file.path | relative_url }}" }{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ];
    const imageAlt = {
      'white-flowers.jpeg': 'White flowers blooming among gray-green stems',
      'cat-under-tree.jpeg': 'A cat peeking through tall grass under a tree',
      'nvidia-sticker-tablet.jpeg': 'NVIDIA sticker on a tablet beside a keyboard and stylus',
      'rainbow-city-street.jpeg': 'A rainbow above traffic on a city street'
    };

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    const grid = document.getElementById('image-grid');
    shuffleArray(images).forEach(image => {
      const a = document.createElement('a');
      a.href = image.src;
      a.target = '_blank';
      a.rel = 'noopener';
      const img = document.createElement('img');
      img.src = image.src;
      img.alt = imageAlt[image.src.split('/').pop()] || '';
      img.loading = 'lazy';
      a.appendChild(img);
      grid.appendChild(a);
    });
    </script>
  </div>
</article>
