<header>
  <h1><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h1>
  {%- assign date_format = site.date_format | default: "%B %d, %Y" -%}
  {%- assign shown = include.post["date-string"] -%}
  <time datetime="{{ include.post.date | date_to_xmlschema }}">{% if shown %}{{ shown }}{% else %}{{ include.post.date | date: date_format }}{% endif %}</time>
</header>
